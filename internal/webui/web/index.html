<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harness</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; margin: 2rem; background: #0f172a; color: #e2e8f0; }
    h1 { color: #38bdf8; }
    code { background: #1e293b; padding: 0.2rem 0.4rem; border-radius: 0.25rem; }
    #log { margin-top: 1rem; max-height: 20rem; overflow: auto; background: #1e293b; padding: 1rem; border-radius: 0.5rem; font-size: 0.875rem; }
    .event { margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <h1>Harness Daemon</h1>
  <p>This is a placeholder web UI. Pair your phone or another PC, then open the WebSocket at <code>/ws</code>.</p>
  <div id="log"></div>
  <script>
    const log = document.getElementById('log');
    function add(msg) {
      const div = document.createElement('div');
      div.className = 'event';
      div.textContent = new Date().toLocaleTimeString() + ' ' + msg;
      log.appendChild(div);
    }
    add('placeholder loaded');
  </script>
</body>
</html>
